name: larger_chunks_1024
chunking:
  strategy: fixed
  chunk_size: 1024
  overlap: 256
  min_chunk_size: 50
embedding:
  model_name: all-MiniLM-L6-v2
  batch_size: 64
  normalize: true
retrieval:
  top_k: 10
  use_bm25: false
  bm25_weight: 0.3
  dense_weight: 0.7
abstention:
  enabled: true
  score_threshold: 0.3
  min_gap: 0.0
