name: abl_512_route_strip
chunking:
  strategy: fixed
  chunk_size: 512
  overlap: 128
  min_chunk_size: 50
  heading_aware: false
embedding:
  model_name: all-MiniLM-L6-v2
  batch_size: 64
  normalize: true
retrieval:
  top_k: 10
  use_routing: true
  strip_query_prefix: true
  use_bm25: false
  bm25_weight: 0.3
  dense_weight: 0.7
  use_rrf: true
  rrf_k: 60
  use_reranker: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_top_k: 30
  downweight_preamble: false
  preamble_weight: 0.8
abstention:
  enabled: true
  score_threshold: 0.3
  min_gap: 0.0
  margin_threshold: 0.0
  use_reranker_score: false
  reranker_threshold: -1.0
